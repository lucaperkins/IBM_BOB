[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "parkipredict"
version = "0.1.0"
description = "Workspace package for Parkinson's UPDRS true-OFF score prediction experiments."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
